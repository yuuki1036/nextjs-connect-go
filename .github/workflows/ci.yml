name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # mise.toml の node と揃える
          node-version: "24.11.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # mise.toml の go と揃える
          go-version: "1.27.3"
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  # proto と commit した生成物（backend/gen・frontend/src/gen）がずれていないかを確かめる
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          version: "1.75.0"
          setup_only: true
      - run: buf generate
        working-directory: proto
      - name: 生成物に差分が無いことを確かめる
        run: |
          git add -A
          if ! git diff --cached --exit-code --stat; then
            echo "::error::proto と生成物がずれている。proto/ で buf generate を走らせて、生成物を commit する"
            exit 1
          fi
